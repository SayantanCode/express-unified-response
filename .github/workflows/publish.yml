name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Version Bump
        id: bump
        run: |
          BUMP_TYPE="patch"

          COMMITS=$(git log --format=%s HEAD~20..HEAD)

          echo "$COMMITS"

          if echo "$COMMITS" | grep -qiE "major:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "minor:"; then
            BUMP_TYPE="minor"
          fi

          echo "Detected bump type: $BUMP_TYPE"

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Bump Version
        run: |
          BUMP_TYPE="${{ steps.bump.outputs.bump_type }}"

          npm version $BUMP_TYPE -m "chore(release): %s [skip ci]"

      - name: Run Build
        run: npm run build

      - name: Check dist
        run: ls -R dist

      - name: Publish to NPM
        run: npm publish --access public --provenance

      - name: Push Version Changes and Tags
        run: |
          git push origin main --follow-tags