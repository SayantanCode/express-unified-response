name: Publish to NPM

on:
  push:
    branches:
      - main

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type
        id: bump
        run: |
          BUMP_TYPE="patch"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=%B)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=%B)
          fi

          # Matches the commit convention from CONTRIBUTING.md (feat:/fix:/docs:/refactor:/test:/chore:)
          # feat: -> minor, a "!" breaking marker or "BREAKING CHANGE" footer -> major, anything else -> patch
          if echo "$COMMITS" | grep -qiE "^BREAKING CHANGE:|^(feat|fix)(\([^)]*\))?!:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\([^)]*\))?:"; then
            BUMP_TYPE="minor"
          fi

          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Bump package version
        run: npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

      - name: Read new version
        id: version
        run: echo "next=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm publish --access public --provenance --loglevel verbose

      - name: Print npm debug log
        if: failure()
        run: |
          echo "===== NPM DEBUG LOG ====="
          cat /home/runner/.npm/_logs/*.log || true

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.next }} [skip ci]"

      - name: Create git tag
        run: git tag v${{ steps.version.outputs.next }}

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin v${{ steps.version.outputs.next }}